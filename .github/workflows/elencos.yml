name: Baixar dados dos elencos

# Baixa as fontes públicas dos elencos reais e grava tudo na branch dados-elencos.
# Roda no GitHub porque a rede do ambiente de desenvolvimento não alcança esses sites.
# Quem monta os elencos do jogo a partir desses arquivos é tools/elencos/montar.ts.
on:
  workflow_dispatch:
    inputs:
      fase:
        description: "elencos: Séries A, B e C (branch dados-elencos) · times: Série D, estaduais e ligas da América do Sul (branch dados-times) · segundas: segunda divisão dos países da América do Sul (branch dados-segundas) · america: Concacaf, 3ª divisões, 2ª dos estaduais, copas e seleções (branch dados-america) · europa: 7 ligas da Europa e copas da UEFA (branch dados-europa) · selecoes-europa: convocações das 55 seleções da UEFA (branch dados-selecoes-europa) · europa-segundas: segunda divisão das 7 ligas da Europa (branch dados-europa-segundas)"
        type: choice
        default: elencos
        options: [elencos, times, segundas, america, europa, selecoes-europa, europa-segundas]

permissions:
  contents: write

jobs:
  baixar:
    if: inputs.fase == 'elencos'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Preparar (programa das súmulas do BrazilianFootball/data, licença MIT)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet PyPDF2==3.0.1 requests
          git clone --quiet --depth 1 https://github.com/BrazilianFootball/data /tmp/bf
          mkdir -p dados/sumulas
          # Três temporadas: a mais recente diz quem está em cada clube; as anteriores ajudam a deduzir posições.
          # A Copa do Brasil traz os clubes dos estaduais que não jogam as séries (tools/times/montar.ts).
          for arquivo in /tmp/bf/results/processed/Serie_[ABCD]_202[345]_games.json /tmp/bf/results/processed/CdB_202[345]_games.json; do
            gzip -c "$arquivo" > "dados/sumulas/$(basename "$arquivo").gz"
          done
      - name: Súmulas da CBF de 2026 (Séries A, B e C)
        continue-on-error: true
        run: /tmp/venv/bin/python tools/elencos/sumulas_cbf.py /tmp/bf 2026 dados
      - name: Cartola (posições da Série A)
        continue-on-error: true
        run: |
          curl -sSf -A "Proffut/0.1 (jogo pessoal; https://github.com/Vinicius-leon10/Proffut)" \
            https://api.cartola.globo.com/atletas/mercado -o /tmp/cartola.json
          gzip -c /tmp/cartola.json > dados/cartola-mercado.json.gz
      - name: Transfermarkt (base livre CC0 do projeto transfermarkt-datasets)
        continue-on-error: true
        run: |
          curl -sSfL https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/players.csv.gz -o /tmp/players.csv.gz
          curl -sSfL https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/clubs.csv.gz -o /tmp/clubs.csv.gz
          /tmp/venv/bin/python tools/elencos/filtrar_transfermarkt.py /tmp/players.csv.gz /tmp/clubs.csv.gz dados
      - name: Wikidata (posição e nascimento)
        continue-on-error: true
        run: /tmp/venv/bin/python tools/elencos/wikidata.py dados
      - name: Gravar na branch dados-elencos
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dados
          {
            echo "# Dados dos elencos"
            echo
            echo "Baixados em $(date -u +%Y-%m-%dT%H:%MZ) pelo workflow elencos.yml do Proffut."
            echo
            echo "- Súmulas da CBF (2023 a 2025) lidas pelo programa do BrazilianFootball/data (licença MIT)"
            echo "- Cartola FC (posições da Série A)"
            echo "- transfermarkt-datasets (CC0)"
            echo "- Wikidata (CC0)"
            echo
            echo "| Arquivo | Tamanho |"
            echo "|---|---|"
            find . -type f -not -name LEIAME.md | sort | while read -r f; do echo "| ${f#./} | $(du -h "$f" | cut -f1) |"; done
          } > LEIAME.md
          cat LEIAME.md >> "$GITHUB_STEP_SUMMARY"
          git init -q -b dados-elencos
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Dados dos elencos (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados-elencos

  # Times novos: páginas da Série D, dos estaduais e das ligas dos outros países da Conmebol (Wikipédia), dados dos
  # clubes e de quem está nos elencos (Wikidata) e os jogadores das ligas sul-americanas que o Transfermarkt cobre.
  # Quem monta os clubes e os elencos do jogo a partir desses arquivos é tools/times/montar.ts.
  times:
    if: inputs.fase == 'times'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Wikipédia e Wikidata
        run: python3 tools/times/wikipedia.py tools/times/sementes.json dados
      - name: Transfermarkt (ligas da América do Sul)
        continue-on-error: true
        run: |
          curl -sSfL https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/players.csv.gz -o /tmp/players.csv.gz
          curl -sSfL https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/clubs.csv.gz -o /tmp/clubs.csv.gz
          python3 tools/times/filtrar_transfermarkt.py /tmp/players.csv.gz /tmp/clubs.csv.gz dados
      - name: Gravar na branch dados-times
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dados
          {
            echo "# Dados dos times novos"
            echo
            echo "Baixados em $(date -u +%Y-%m-%dT%H:%MZ) pelo workflow elencos.yml (fase times) do Proffut."
            echo
            echo "- Wikipédia (CC BY-SA): páginas dos campeonatos de 2026 e dos clubes"
            echo "- Wikidata (CC0): clubes e jogadores"
            echo "- transfermarkt-datasets (CC0): ligas da América do Sul que a base cobre"
            echo
            echo "| Arquivo | Tamanho |"
            echo "|---|---|"
            find . -type f -not -name LEIAME.md | sort | while read -r f; do echo "| ${f#./} | $(du -h "$f" | cut -f1) |"; done
          } > LEIAME.md
          cat LEIAME.md >> "$GITHUB_STEP_SUMMARY"
          git init -q -b dados-times
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Dados dos times novos (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados-times

  # Segunda divisão de 2026 dos outros 9 países da Conmebol: só as sementes liga2-, numa branch própria, para os dados
  # das primeiras divisões e dos estaduais (branch dados-times) ficarem como estão. tools/times/montar.ts junta as duas.
  segundas:
    if: inputs.fase == 'segundas'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Wikipédia e Wikidata (só as segundas divisões)
        run: python3 tools/times/wikipedia.py tools/times/sementes.json dados liga2-
      - name: Gravar na branch dados-segundas
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dados
          {
            echo "# Dados das segundas divisões"
            echo
            echo "Baixados em $(date -u +%Y-%m-%dT%H:%MZ) pelo workflow elencos.yml (fase segundas) do Proffut."
            echo
            echo "- Wikipédia (CC BY-SA): páginas das segundas divisões de 2026 e dos clubes"
            echo "- Wikidata (CC0): clubes e jogadores"
            echo
            echo "| Arquivo | Tamanho |"
            echo "|---|---|"
            find . -type f -not -name LEIAME.md | sort | while read -r f; do echo "| ${f#./} | $(du -h "$f" | cut -f1) |"; done
          } > LEIAME.md
          cat LEIAME.md >> "$GITHUB_STEP_SUMMARY"
          git init -q -b dados-segundas
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Dados das segundas divisões (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados-segundas

  america:
    if: inputs.fase == 'america'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - name: Wikipédia e Wikidata (resto da América, copas e seleções)
        run: python3 tools/times/wikipedia.py tools/times/sementes-america.json dados
      - name: Gravar na branch dados-america
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dados
          {
            echo "# Dados do resto da América"
            echo
            echo "Baixados em $(date -u +%Y-%m-%dT%H:%MZ) pelo workflow elencos.yml (fase america) do Proffut."
            echo
            echo "- Wikipédia (CC BY-SA): páginas de 2026 das ligas da Concacaf, das 3ª divisões, da 2ª dos estaduais, das copas, dos clubes e das seleções"
            echo "- Wikidata (CC0): clubes e jogadores"
            echo
            echo "| Arquivo | Tamanho |"
            echo "|---|---|"
            find . -type f -not -name LEIAME.md | sort | while read -r f; do echo "| ${f#./} | $(du -h "$f" | cut -f1) |"; done
          } > LEIAME.md
          cat LEIAME.md >> "$GITHUB_STEP_SUMMARY"
          git init -q -b dados-america
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Dados do resto da América (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados-america

  # Europa: clubes e jogadores das 7 ligas (Inglaterra, Espanha, Itália, Alemanha, França, Portugal, Holanda) e os jogos
  # das copas da UEFA, da base livre do transfermarkt-datasets. Quem monta os clubes do jogo é tools/europa/montar.ts.
  europa:
    if: inputs.fase == 'europa'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Transfermarkt (Europa)
        run: |
          mkdir -p /tmp/tm
          for f in players clubs competitions games; do
            curl -sSfL "https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/$f.csv.gz" -o "/tmp/tm/$f.csv.gz"
          done
          python3 tools/europa/filtrar.py /tmp/tm dados | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gravar na branch dados-europa
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dados
          echo "Baixados em $(date -u +%Y-%m-%dT%H:%MZ) do transfermarkt-datasets (CC0) pelo workflow elencos.yml (fase europa)." > LEIAME.md
          git init -q -b dados-europa
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Dados da Europa (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados-europa

  # Seleções da Europa: a página de cada uma das 55 da UEFA (a seção "Current squad" tem a última convocação).
  # Quem lê os convocados é tools/selecoes/montar.ts.
  selecoes-europa:
    if: inputs.fase == 'selecoes-europa'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Wikipédia (páginas das seleções)
        run: python3 tools/selecoes/baixar.py tools/selecoes/sementes-europa.json dados | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gravar na branch dados-selecoes-europa
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dados
          echo "Baixados em $(date -u +%Y-%m-%dT%H:%MZ) da Wikipédia em inglês (CC BY-SA) pelo workflow elencos.yml (fase selecoes-europa)." > LEIAME.md
          git init -q -b dados-selecoes-europa
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Convocações das seleções da Europa (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados-selecoes-europa

  # Segunda divisão de 2025/26 das 7 ligas da Europa: páginas dos campeonatos e dos clubes (Wikipédia em inglês) e os
  # dados dos clubes e dos jogadores (Wikidata). Quem monta os clubes do jogo é tools/europa/segundas.ts.
  europa-segundas:
    if: inputs.fase == 'europa-segundas'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Wikipédia e Wikidata (segundas divisões da Europa)
        run: python3 tools/times/wikipedia.py tools/europa/sementes-segundas.json dados
      - name: Gravar na branch dados-europa-segundas
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dados
          echo "Baixados em $(date -u +%Y-%m-%dT%H:%MZ) da Wikipédia em inglês (CC BY-SA) e do Wikidata (CC0) pelo workflow elencos.yml (fase europa-segundas)." > LEIAME.md
          git init -q -b dados-europa-segundas
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Segundas divisões da Europa (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados-europa-segundas

name: Checagem diária do site

# Todo dia os testes de ponta a ponta rodam no site publicado (inclusive sem internet).
# Se falhar, o GitHub avisa por e-mail.
on:
  schedule:
    - cron: "17 9 * * *" # 6h17 em Brasília
  workflow_dispatch:

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Testes no site publicado
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run test:e2e
      - name: Mostrar o que a página tinha nos primeiros testes que falharam
        if: failure()
        run: |
          for f in $(ls -d tests/resultado/arquivos/*/ 2>/dev/null | head -3); do echo "=== $f"; head -c 3000 "$f/error-context.md" 2>/dev/null; echo; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checagem-diaria
          path: tests/resultado/

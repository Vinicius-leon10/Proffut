name: Checagem diária do site

# Todo dia o robô abre o site publicado, joga uma partida, testa o jogo sem
# internet e o save. Se falhar, o GitHub avisa por e-mail.
on:
  schedule:
    - cron: "17 9 * * *" # 6h17 em Brasília
  workflow_dispatch:

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Checagem do site publicado
        run: npm run checagem -- "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checagem-diaria
          path: tools/checagem/resultado/

name: Publicar site

# A cada alteração na main: roda todos os testes e só então publica na branch gh-pages,
# que o GitHub Pages serve em https://<usuário>.github.io/Proffut/.
# Se qualquer teste falhar, o site publicado continua como estava.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  motor:
    name: Testes do motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes do motor
        run: npm test

  # Testes de tela em 3 partes ao mesmo tempo (--shard), como no workflow "Testes".
  tela:
    name: Testes de tela (parte ${{ matrix.parte }} de 3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificação de tipos e geração do site
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta antes de publicar
        run: npx playwright test --shard=${{ matrix.parte }}/3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testes-parte-${{ matrix.parte }}
          path: tests/resultado/

  publicar:
    # Só publica com todos os testes verdes (o motor e as 3 partes de tela).
    needs: [motor, tela]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Geração do site
        run: npm run build
      - name: Publicar na branch gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publica ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

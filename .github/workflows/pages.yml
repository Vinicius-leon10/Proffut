name: Publicar site

# A cada alteração na main: roda todos os testes e só então publica na branch gh-pages,
# que o GitHub Pages serve em https://<usuário>.github.io/Proffut/.
# Se qualquer teste falhar, o site publicado continua como estava.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes do motor
        run: npm test
      - name: Verificação de tipos e geração do site
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta antes de publicar
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testes
          path: tests/resultado/
      - name: Publicar na branch gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publica ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

name: Testes

on:
  push:
    branches-ignore: [gh-pages, dados-elencos]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes do motor
        run: npm test
      - name: Verificação de tipos e geração do site
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta (tela de iPhone, inclusive sem internet)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testes
          path: tests/resultado/

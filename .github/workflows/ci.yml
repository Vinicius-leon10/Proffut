name: Testes

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Checagem no navegador (inclusive sem internet)
        run: npm run checagem
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checagem
          path: tools/checagem/resultado/
